rules:
  - id: javascript-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Dynamic evaluation can execute attacker-controlled JavaScript. Avoid eval and parse structured data instead.
    patterns:
      - pattern-either:
          - pattern: eval($INPUT)
          - pattern: new Function(...)
    metadata:
      cwe: CWE-95
      owasp: A03:2021 – Injection
      confidence: HIGH
  - id: javascript-command-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: A shell command includes request-controlled data. Use a fixed executable and validated argument list.
    mode: taint
    pattern-sources:
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.body.$FIELD
      - pattern: $REQ.params.$FIELD
    pattern-sinks:
      - pattern: exec($CMD, ...)
      - pattern: execSync($CMD, ...)
    metadata:
      cwe: CWE-78
      owasp: A03:2021 – Injection
      confidence: HIGH
  - id: javascript-sql-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: Request-controlled data reaches a SQL query. Bind values with the database driver's parameter API.
    mode: taint
    pattern-sources:
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.body.$FIELD
      - pattern: $REQ.params.$FIELD
    pattern-sinks:
      - pattern: $DB.query($SQL, ...)
    metadata:
      cwe: CWE-89
      owasp: A03:2021 – Injection
      confidence: HIGH
  - id: javascript-html-injection
    languages: [javascript, typescript]
    severity: WARNING
    message: HTML is assigned directly to a DOM element. Prefer textContent for untrusted text.
    pattern: $EL.innerHTML = $INPUT
    metadata:
      cwe: CWE-79
      owasp: A03:2021 – Injection
      confidence: MEDIUM
  - id: javascript-tls-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: TLS certificate verification is disabled. Restore verification and configure trusted CAs.
    pattern: "{..., rejectUnauthorized: false, ...}"
    metadata:
      cwe: CWE-295
      owasp: A02:2021 – Cryptographic Failures
      confidence: HIGH
  - id: python-unsafe-yaml
    languages: [python]
    severity: ERROR
    message: Unsafe YAML loading may construct arbitrary Python objects. Use yaml.safe_load for untrusted input.
    pattern: yaml.load($DATA, Loader=yaml.Loader)
    metadata:
      cwe: CWE-502
      owasp: A08:2021 – Software and Data Integrity Failures
      confidence: HIGH
  - id: javascript-path-traversal
    languages: [javascript, typescript]
    severity: ERROR
    message: Request-controlled input reaches a filesystem read. Resolve against an allowed root and reject escaping paths.
    mode: taint
    pattern-sources:
      - pattern: $REQ.query.$FIELD
      - pattern: $REQ.params.$FIELD
      - pattern: $REQ.body.$FIELD
    pattern-sinks:
      - pattern: readFile($PATH, ...)
      - pattern: readFileSync($PATH, ...)
      - pattern: $FS.readFile($PATH, ...)
      - pattern: $FS.readFileSync($PATH, ...)
    metadata:
      cwe: CWE-22
      owasp: A01:2021 – Broken Access Control
      confidence: HIGH
  - id: javascript-weak-crypto
    languages: [javascript, typescript]
    severity: WARNING
    message: A weak hash is used. Verify whether this protects sensitive data and use a modern algorithm or password hashing scheme.
    patterns:
      - pattern-either:
          - pattern: createHash("md5")
          - pattern: createHash("sha1")
          - pattern: $C.createHash("md5")
          - pattern: $C.createHash("sha1")
    metadata:
      cwe: CWE-327
      owasp: A02:2021 – Cryptographic Failures
      confidence: MEDIUM
  - id: javascript-jwt-none
    languages: [javascript, typescript]
    severity: ERROR
    message: JWT verification permits an unsigned algorithm. Require an explicit signed algorithm and validate issuer and audience.
    pattern: "{..., algorithms: [..., 'none', ...], ...}"
    metadata:
      cwe: CWE-347
      owasp: A07:2021 – Identification and Authentication Failures
      confidence: HIGH
  - id: python-debug-enabled
    languages: [python]
    severity: WARNING
    message: Debug mode can expose application internals. Disable it in deployed environments.
    pattern: $APP.run(..., debug=True, ...)
    metadata:
      cwe: CWE-489
      owasp: A05:2021 – Security Misconfiguration
      confidence: MEDIUM
