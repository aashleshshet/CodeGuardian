services:
  api:
    environment:
      LLM_ENABLED: "true"
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: qwen2.5-coder:1.5b
      LLM_ALLOW_REMOTE: "false"
  frontend:
    environment:
      LOCAL_MODEL_ENABLED: "true"
  ollama:
    image: ollama/ollama:0.40.15
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "0"
    volumes: ["model_store:/root/.ollama"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2500m
    cpus: 2
    restart: unless-stopped
    networks: [local]
    healthcheck:
      test: ["CMD", "ollama", "show", "qwen2.5-coder:1.5b"]
      interval: 10s
      timeout: 5s
      retries: 12
  model-download:
    profiles: [model-setup]
    image: ollama/ollama:0.40.15
    environment: {OLLAMA_NO_CLOUD: "1"}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ollama serve >/tmp/provision.log 2>&1 &
        server=$$!
        trap 'kill "$$server" 2>/dev/null || true' EXIT
        tries=0
        until ollama list >/dev/null 2>&1; do
          tries=$$((tries+1)); [ "$$tries" -lt 30 ] || exit 1; sleep 1
        done
        ollama pull qwen2.5-coder:1.5b
        ollama show qwen2.5-coder:1.5b >/dev/null
    volumes: ["model_store:/root/.ollama"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [updates]
volumes:
  model_store:
