name: Verify CodeGuardian
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements.txt
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Test trust boundaries and real scanners
        run: .venv/bin/pytest backend/tests -q
      - name: Typecheck and build
        run: pnpm typecheck && pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test browser and full-stack flow
        run: pnpm test:e2e
      - name: Verify scanner isolation in Docker
        run: |
          docker build -f backend/Dockerfile --target scanner -t codeguardian-scanner:local .
          .venv/bin/python -m zipfile -c /tmp/fixture.zip fixtures/current/api/payments.py
          SCANNER_MODE=docker .venv/bin/python scripts/scan_archive.py /tmp/fixture.zip --output /tmp/scan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: {name: test-evidence, path: test-results/, retention-days: 7}
